name: server
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit, contract, security and scenario tests
        run: python -m pytest -q
      - name: Demo must pass every scenario
        run: python demo.py
      - name: Samples must be reproducible
        run: |
          python export_samples.py
          git diff --exit-code samples/
