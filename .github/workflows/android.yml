name: android
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the test APK as a pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable (lost when files are uploaded through the website)
        run: chmod +x android/gradlew

      - name: Start a FortGuard dev server for the live SDK tests
        run: |
          pip install -r requirements.txt
          nohup python -m fortguard.app --dev --port 8080 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done

      - name: SDK unit tests and live-server tests
        working-directory: android
        env:
          FORTGUARD_TEST_SERVER: http://127.0.0.1:8080
        run: ./gradlew --no-daemon :fortguard-sdk:testDebugUnitTest --stacktrace

      - name: Build the demo APK
        working-directory: android
        run: ./gradlew --no-daemon :demo-app:assembleDebug --stacktrace

      - name: Lint (report only)
        working-directory: android
        continue-on-error: true
        run: ./gradlew --no-daemon :demo-app:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            android/demo-app/build/outputs/apk/debug/*.apk
            android/fortguard-sdk/build/reports/tests/
            android/demo-app/build/reports/lint-results-debug.html
            server.log

      - name: Publish the APK as the "android-test" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/demo-app/build/outputs/apk/debug/demo-app-debug.apk FortGuardDemo.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test FortGuardDemo.apk --prerelease --target "$GITHUB_SHA" \
            --title "FortGuard Demo APK (test build)" \
            --notes "Debug build from commit $GITHUB_SHA. Testing only: simulated attestation, debug-signed."
